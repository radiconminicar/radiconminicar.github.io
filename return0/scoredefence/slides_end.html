<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
html,body{margin:0;height:100%;background:#111;overflow:hidden;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1358px;background:#fff;overflow:hidden;transform-origin:0 0}
.sl{position:absolute;left:0;top:0;width:100%;height:100%;visibility:hidden}
.sl.on{visibility:visible}
.sl img{position:absolute;display:block;max-width:none;-webkit-user-drag:none;user-select:none}
.sl img.hid{visibility:hidden}
.wm{-webkit-mask-image:conic-gradient(#000 var(--a),transparent 0);mask-image:conic-gradient(#000 var(--a),transparent 0)}
@keyframes kf-appear{from{visibility:hidden}to{visibility:visible}}
@keyframes kf-fade{from{opacity:0}to{opacity:1}}
@keyframes kf-zoom{from{scale:0;opacity:0}to{scale:1;opacity:1}}
@keyframes kf-split{from{clip-path:inset(0 50% 0 50%)}to{clip-path:inset(0)}}
@keyframes kf-wipe-left{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes kf-wipe-right{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
@keyframes kf-wipe-top{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes kf-wipe-bottom{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
@keyframes kf-fly{from{translate:var(--fx) var(--fy)}to{translate:0 0}}
@keyframes kf-wheel{from{--a:0deg}to{--a:360deg}}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);font:14px sans-serif;padding:8px 14px;border-radius:8px;transition:opacity .6s;pointer-events:none;z-index:9}
