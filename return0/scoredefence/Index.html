<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html, body { height:100%; margin:0; overflow:hidden; background:#fff; color:#000; font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif; }
  #slider { display:flex; width:300vw; height:100%; transform:translateX(-100vw); transition:transform .7s ease-in-out; }
  #slider.v-slides { transform:translateX(0); }
  #slider.em { transform:translateX(-200vw); }
  #slides { background:#111; }
  #slidesFrame, #endFrame { display:block; width:100%; height:100%; border:0; pointer-events:none; }
  /* 後説スライド(Eキー)。スコア画面の上に右からスライドして重なる */
  #endScr { position:fixed; inset:0; background:#111; transform:translateX(100%); transition:transform .7s ease-in-out; z-index:3; }
  #endScr.on { transform:translateX(0); }
  #slider.em ~ #endScr { transform:translateX(100%); }
  .screen { width:100vw; height:100%; flex:none; position:relative; box-sizing:border-box; }
  #main { display:flex; flex-direction:column; }
  .grid { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; background:#000; min-height:0; }
  .cell { position:relative; background:#fff; display:flex; align-items:center; justify-content:center; }
  .name { position:absolute; top:1.5vmin; left:2.5vmin; font-size:4vmin; font-weight:700; }
  .score { font-size:15vmin; font-weight:800; font-family:'Zen Maru Gothic',sans-serif; font-variant-numeric:tabular-nums; transition:color .3s; }
  .score.changed { color:#dc2626; }
  #em { background:#fff; }
  #emhead { position:absolute; top:2vmin; left:3vmin; z-index:2; background:#fff; padding:.5vmin 2vmin; border:2px solid #dc2626; border-radius:1.5vmin; }
  #emlabel { font-size:3vmin; font-weight:700; color:#dc2626; }
  #emtimer { font-size:9vmin; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
  #embody { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #embody img { max-width:100%; max-height:100%; object-fit:contain; }
  #emtext { font-size:10vmin; font-weight:800; color:#dc2626; }
  #em.announce #emhead { display:none; }
  #emtext.warn { animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  canvas.cf { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  /* デバッグ表示(F1で切り替え。通常は非表示) */
  #timer { position:fixed; right:8px; bottom:32px; z-index:5; font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; background:rgba(255,255,255,.85); padding:2px 8px; border-radius:4px; }
  #timer.ended { color:#dc2626; }
  #timer.paused { color:#888; }
  #status { position:fixed; right:8px; bottom:6px; font-size:12px; background:rgba(255,255,255,.85); padding:2px 6px; border-radius:4px; z-index:5; }
  #timer, #status { display:none; }
  body.debug #timer, body.debug #status { display:block; }
</style>
</head>
<body>
<div id="slider" class="v-slides">
  <div class="screen" id="slides"><iframe id="slidesFrame" src="slides.html" title="slides" tabindex="-1"></iframe></div>
  <div class="screen" id="main">
    <div class="grid">
      <div class="cell"><div class="name">Team1</div><div class="score" id="s0">-</div></div>
      <div class="cell"><div class="name">Team2</div><div class="score" id="s1">-</div></div>
      <div class="cell"><div class="name">Team3</div><div class="score" id="s2">-</div></div>
      <div class="cell"><div class="name">Team4</div><div class="score" id="s3">-</div></div>
    </div>
  </div>
  <div class="screen" id="em">
    <div id="embody"></div>
    <div id="emhead"><div id="emlabel">緊急ミッション</div><div id="emtimer">01:00</div></div>
  </div>
</div>
<div id="endScr"><iframe id="endFrame" src="slides_end.html" title="slides_end" tabindex="-1"></iframe></div>
<div id="timer">--:--</div>
<div id="status">読み込み中…</div>

<script>
/* ========== スコア取得 ========== */
// 数値は3桁区切り(1,234)で表示。数値でないセルはシートの表示文字列をそのまま使う
function scoreText(c) {
  if (!c) return "";
  if (typeof c.v === "number") return c.v.toLocaleString("en-US");
  return c.f ?? (c.v ?? "");
}
const SHEET_ID = "1SBp0oQzCXvHXjJiSSaP_IdJwrLUkB9OYhSfoGcw49Ms";
const SHEET_NAME = "Score", RANGE = "C14:F14", INTERVAL_MS = 5000;
window.__onSheet = function (res) {
  const st = document.getElementById("status");
  try {
    if (res.status !== "ok") throw new Error(res.errors?.[0]?.message || "error");
    if (finalMode) { st.textContent = "最終更新 " + new Date().toLocaleTimeString("ja-JP"); return; }
    const cells = res.table.rows[0]?.c || [];
    for (let i = 0; i < 4; i++) {
      const c = cells[i], text = scoreText(c);
      const el = document.getElementById("s" + i);
      if (el.textContent !== String(text)) {
        el.textContent = text === "" ? "-" : text;
        el.classList.add("changed");
        setTimeout(() => el.classList.remove("changed"), 1200);
      }
    }
    st.textContent = "最終更新 " + new Date().toLocaleTimeString("ja-JP");
  } catch (e) { st.textContent = "取得失敗: " + e.message; }
};
function load() {
  document.getElementById("jsonp")?.remove();
  const s = document.createElement("script");
  s.id = "jsonp";
  s.onerror = () => { document.getElementById("status").textContent = "取得失敗(共有設定を確認)"; };
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:__onSheet&sheet=${encodeURIComponent(SHEET_NAME)}&range=${RANGE}&headers=0&_=${Date.now()}`;
  document.body.appendChild(s);
}
load(); setInterval(load, INTERVAL_MS);

/* ========== 最終スコア表示(F12) + 紙吹雪 ========== */
const FINAL_RANGE = "C14:F14";   // 「最終スコア」行
let finalMode = false;
const cf = {};
window.__onFinal = function (res) {
  if (!finalMode) return;
  try {
    if (res.status !== "ok") throw new Error(res.errors?.[0]?.message || "error");
    const cells = res.table.rows[0]?.c || [], vals = [];
    for (let i = 0; i < 4; i++) {
      const c = cells[i], text = scoreText(c);
      document.getElementById("s" + i).textContent = text === "" ? "-" : text;
      vals.push(typeof c?.v === "number" ? c.v : NaN);
    }
    const max = Math.max(...vals.filter(v => !isNaN(v)));
    clearConfetti();
    vals.forEach((v, i) => { if (v === max) addConfetti(i); });
  } catch (e) { finalMode = false; bgmUpdate(); document.getElementById("status").textContent = "最終スコア取得失敗: " + e.message; }
};
function toggleFinal() {
  if (finalMode) { exitFinal(); return; }
  finalMode = true;
  bgmUpdate();
  document.getElementById("jsonpFinal")?.remove();
  const s = document.createElement("script");
  s.id = "jsonpFinal";
  s.onerror = () => { finalMode = false; bgmUpdate(); document.getElementById("status").textContent = "最終スコア取得失敗"; };
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:__onFinal&sheet=${encodeURIComponent(SHEET_NAME)}&range=${FINAL_RANGE}&headers=0&_=${Date.now()}`;
  document.body.appendChild(s);
}
function exitFinal() { if (!finalMode) return; finalMode = false; clearConfetti(); load(); bgmUpdate(); }
function clearConfetti() { for (const k in cf) { cancelAnimationFrame(cf[k].raf); cf[k].cv.remove(); delete cf[k]; } }
function addConfetti(i) {
  const cell = document.getElementById("s" + i).parentElement;
  const cv = document.createElement("canvas"); cv.className = "cf"; cell.appendChild(cv);
  const ctx = cv.getContext("2d"), colors = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#a855f7", "#ec4899"];
  let W = 0, H = 0;
  const size = () => { W = cv.width = cell.clientWidth; H = cv.height = cell.clientHeight; };
  size();
  const mk = init => ({ x: Math.random() * W, y: init ? Math.random() * H : -20, w: 6 + Math.random() * 8, h: 10 + Math.random() * 10,
    vy: 2 + Math.random() * 3, vx: -1 + Math.random() * 2, rot: Math.random() * 6.28, vr: -.2 + Math.random() * .4, c: colors[(Math.random() * colors.length) | 0] });
  const parts = Array.from({ length: 140 }, () => mk(true));
  const loop = () => {
    if (cv.width !== cell.clientWidth || cv.height !== cell.clientHeight) size();
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.y / 30); p.rot += p.vr;
      if (p.y > H + 20) Object.assign(p, mk(false));
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    cf[i].raf = requestAnimationFrame(loop);
  };
  cf[i] = { cv, raf: requestAnimationFrame(loop) };
}

/* ========== 設定(localStorage。操作画面control.htmlと共有) ========== */
const DEFAULT_CFG = { total: 3600, missions: [
  { at: 2400, dur: 60, img: "" },   // 残り40:00
  { at: 1200, dur: 60, img: "" }    // 残り20:00
]};
let cfg;
function loadCfg() {
  let c = null;
  try { c = JSON.parse(localStorage.getItem("sb_cfg")); } catch (e) {}
  if (!c || !Array.isArray(c.missions)) c = JSON.parse(JSON.stringify(DEFAULT_CFG));
  c.missions.forEach(m => { m.id = m.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6); });
  cfg = c;
  try { localStorage.setItem("sb_cfg", JSON.stringify(cfg)); } catch (e) {}
}
loadCfg();
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");

/* ========== 緊急ミッション ========== */
const slider = document.getElementById("slider");
const emTimer = document.getElementById("emtimer");
let emActive = null, emTick = null, emEnd = 0, done = new Set();

let emPhase = null, autoPaused = false;
const emScreen = document.getElementById("em");
// 予告画面を出し、全体タイマーを一時停止する
function startEmergency(m) {
  done.add(m.id);
  emActive = m; emPhase = "announce";
  clearInterval(emTick); emTick = null;
  if (tick) { remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000)); stop(); paused = true; autoPaused = true; render(); }
  const body = document.getElementById("embody");
  body.innerHTML = "";
  const d = document.createElement("div"); d.id = "emtext"; d.className = "warn"; d.textContent = "緊急ミッションが出るぞ！";
  body.appendChild(d);
  emScreen.classList.add("announce");
  slider.classList.add("em");
  bgmUpdate();
}
// F4: ミッションを出題し、緊急ミッションのタイマーを開始(全体タイマーも再開)
function beginEmergency() {
  if (emPhase !== "announce" || !emActive) return;
  const m = emActive, n = cfg.missions.indexOf(m) + 1;
  if (autoPaused) { autoPaused = false; startTimer(); }
  emPhase = "running";
  document.getElementById("emlabel").textContent = "緊急ミッション " + n;
  const body = document.getElementById("embody");
  body.innerHTML = "";
  if (m.img) { const i = document.createElement("img"); i.src = m.img; body.appendChild(i); }
  else { const d = document.createElement("div"); d.id = "emtext"; d.textContent = "緊急ミッション " + n; body.appendChild(d); }
  emTimer.textContent = fmt(m.dur);
  emScreen.classList.remove("announce");
  runEm(m.dur);
}
function runEm(sec) {
  emEnd = Date.now() + sec * 1000;
  clearInterval(emTick);
  emTick = setInterval(() => {
    const r = Math.max(0, Math.round((emEnd - Date.now()) / 1000));
    emTimer.textContent = fmt(r);
    if (r === 0) endEmergency();
  }, 250);
}
function endEmergency() {
  clearInterval(emTick); emTick = null; emActive = null; emPhase = null;
  emScreen.classList.remove("announce");
  slider.classList.remove("em");
  if (autoPaused) { autoPaused = false; startTimer(); }   // 予告中に閉じたら全体タイマーを再開
  bgmUpdate();
}
function checkMissions() {
  if (emActive || remaining === null || remaining <= 0) return;
  const due = cfg.missions.filter(m => !done.has(m.id) && m.at > 0 && remaining <= m.at)
                          .sort((a, b) => b.at - a.at)[0];
  if (due) startEmergency(due);
}

/* ========== メインタイマー ========== */
const timerEl = document.getElementById("timer");
let remaining = null, endAt = 0, tick = null, paused = false, emLeft = 0;
function render() {
  timerEl.textContent = remaining === null ? "--:--" : fmt(remaining);
  timerEl.classList.toggle("ended", remaining === 0);
  timerEl.classList.toggle("paused", paused);
}
function stop() { clearInterval(tick); tick = null; }
function setTimer() { stop(); paused = false; autoPaused = false; exitFinal(); endEmergency(); done.clear(); remaining = cfg.total; render(); }
function startTimer() {
  if (tick || remaining === null || remaining <= 0) return;
  paused = false;
  endAt = Date.now() + remaining * 1000;
  tick = setInterval(() => {
    remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    render(); checkMissions();
    if (remaining === 0) stop();
  }, 250);
  if (emActive && emPhase === "running") runEm(emLeft);
  render(); checkMissions();
}
function togglePause() {
  if (paused) { startTimer(); return; }
  if (!tick || emPhase === "announce") return;
  remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
  if (emActive) {
    emLeft = Math.max(0, Math.round((emEnd - Date.now()) / 1000));
    clearInterval(emTick); emTick = null;
  }
  stop(); paused = true; render();
}
function clearTimer() { stop(); paused = false; autoPaused = false; exitFinal(); endEmergency(); done.clear(); remaining = null; render(); }

/* ========== スライド(slides.html / slides_end.html を iframe で参照) ========== */
// スライドのHTMLは書き換えず、キー入力(Enter / ←)を iframe に送って進めます。
// slides.html(前説)は最後のスライドの次でスコア画面に切り替わります。
// slides_end.html(後説)はEキーで表示し、最後のスライドで止まります。
const decks = {
  slides: { frame: document.getElementById("slidesFrame"), file: "slides.html", ready: false, s: 1, t: 0, last: 1, steps: {}, err: "" },
  end:    { frame: document.getElementById("endFrame"),    file: "slides_end.html", ready: false, s: 1, t: 0, last: 1, steps: {}, err: "" }
};
const sl = { view: "slides" };              // "slides" | "main" | "end"
const curDeck = () => decks[sl.view] || null;
function slInit(dk) {
  try {
    const w = dk.frame.contentWindow, d = dk.frame.contentDocument;
    if (!d || typeof w.__go !== "function") throw new Error(dk.file + " を読み込み中");
    const src = [...d.scripts].map(x => x.textContent).join("\n");
    const m1 = src.match(/var\s+STEPS\s*=\s*(\{[^}]*\})/), m2 = src.match(/var\s+LAST\s*=\s*(\d+)/);
    if (!m1 || !m2) throw new Error(dk.file + " の STEPS/LAST が見つかりません");
    dk.steps = JSON.parse(m1[1].replace(/(\d+)\s*:/g, '"$1":'));
    dk.last = +m2[1]; dk.ready = true; dk.err = "";
  } catch (e) {
    dk.ready = false;
    dk.err = (e && e.name === "SecurityError") ? "スライド連携不可(file://ではなくGitHub Pagesかローカルサーバーで開いてください)" : e.message;
  }
}
Object.values(decks).forEach(dk => {
  dk.frame.addEventListener("load", () => slInit(dk));
  const wait = setInterval(() => { if (dk.ready) clearInterval(wait); else slInit(dk); }, 500);
});
function slKey(dk, key) {
  const w = dk.frame.contentWindow;
  w.dispatchEvent(new w.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true }));
}
function setView(v) {
  sl.view = v;
  slider.classList.toggle("v-slides", v === "slides");
  document.getElementById("endScr").classList.toggle("on", v === "end");
  bgmUpdate();
}
function slNext() {
  const dk = curDeck();
  if (!dk || !dk.ready) return;
  if (dk.t < (dk.steps[dk.s] || 0)) { dk.t++; slKey(dk, "Enter"); }
  else if (dk.s < dk.last) { dk.s++; dk.t = 0; slKey(dk, "Enter"); }
  else if (sl.view === "slides") setView("main");   // 前説の最後が終わったらスコア画面へ
  bgmUpdate();
}
function slBack() {
  const dk = curDeck();
  if (!dk || !dk.ready) return;
  if (dk.t > 0) { dk.t--; slKey(dk, "ArrowLeft"); }
  else if (dk.s > 1) { dk.s--; dk.t = dk.steps[dk.s] || 0; slKey(dk, "ArrowLeft"); }
  bgmUpdate();
}
function showDeck(v) {                     // 1枚目から表示し直す
  const dk = decks[v];
  dk.s = 1; dk.t = 0;
  if (dk.ready) dk.frame.contentWindow.__go(1, 0);
  setView(v);
}
const showSlides = () => showDeck("slides");
const showEnd = () => showDeck("end");

/* ========== BGM ========== */
// 自動選曲(優先順):
//   緊急ミッション(予告含む)=emergency / 前説1枚目=entry / 前説2枚目以降=pre / 後説=end /
//   最終スコア表示=bestteam / 最後の緊急ミッション終了後のスコア画面=last10 / スコア画面=game
// Mキーで再生/停止。操作画面から手動で曲を選ぶと、次に自動選曲が切り替わるまでその曲を流す
const BGM_FILES = {
  entry: "music/bgm_entry.mp3", pre: "music/bgm_pre.mp3", game: "music/bgm_game.mp3", last10: "music/bgm_last10.mp3",
  emergency: "music/bgm_emergency.mp3", bestteam: "music/bgm_bestteam.mp3", end: "music/bgm_end.mp3"
};
const BGM_RESUME = new Set([BGM_FILES.game, BGM_FILES.last10]);   // スコア画面の曲は緊急ミッション明けに続きから
const bgm = { on: true, cur: null, blocked: false, tracks: {}, manual: null };
function bgmTrack(file) {
  if (!bgm.tracks[file]) { const a = new Audio(file); a.loop = true; a.preload = "auto"; bgm.tracks[file] = a; }
  return bgm.tracks[file];
}
Object.values(BGM_FILES).forEach(bgmTrack);
function allMissionsDone() {
  const ms = cfg.missions.filter(m => m.at > 0);
  return ms.length > 0 && ms.every(m => done.has(m.id));
}
function bgmAutoKey() {
  if (emActive) return "emergency";
  if (sl.view === "slides") return decks.slides.s === 1 ? "entry" : "pre";
  if (sl.view === "end") return "end";
  if (finalMode) return "bestteam";
  return allMissionsDone() ? "last10" : "game";
}
function bgmWant() {
  const key = bgmAutoKey();
  if (bgm.manual && bgm.manual.base !== key) bgm.manual = null;    // 場面が変わったら自動選曲に戻る
  return bgm.manual ? bgm.manual.file : BGM_FILES[key];
}
function bgmFade(a, to, ms, done) {
  clearInterval(a._fade);
  const from = a.volume, t0 = Date.now();
  a._fade = setInterval(() => {
    const r = Math.min(1, (Date.now() - t0) / ms);
    a.volume = from + (to - from) * r;
    if (r === 1) { clearInterval(a._fade); if (done) done(); }
  }, 30);
}
function bgmUpdate() {
  const want = bgm.on ? bgmWant() : null;
  for (const f in bgm.tracks) {
    const a = bgm.tracks[f];
    if (f !== want && !a.paused) bgmFade(a, 0, 500, () => a.pause());
  }
  if (want && (want !== bgm.cur || bgm.tracks[want].paused)) {
    const a = bgmTrack(want);
    if (want !== bgm.cur && !BGM_RESUME.has(want)) a.currentTime = 0;
    clearInterval(a._fade); a.volume = 0;
    // 自動再生がブロックされたら、この画面での次のキー/クリック時に再試行
    a.play().then(() => {
      bgm.blocked = false;
      if (bgm.on && bgm.cur === want) bgmFade(a, 1, 500); else a.pause();   // 再生開始までに曲が切り替わった場合
    }).catch(() => { bgm.blocked = true; });
  }
  if (want) bgm.cur = want;
}
function toggleBgm() { bgm.on = !bgm.on; bgmUpdate(); }
function playManual(file) {
  if (!/^music\/[^\/]+\.mp3$/i.test(file)) return;
  bgm.manual = { file, base: bgmAutoKey() };
  bgm.on = true;
  bgmTrack(file).currentTime = 0;                                  // 手動で選んだ曲は常に頭から
  bgmUpdate();
}
function bgmAuto() { bgm.manual = null; bgmUpdate(); }
const bgmRetry = () => { if (bgm.blocked) bgmUpdate(); };
addEventListener("keydown", bgmRetry, true); addEventListener("mousedown", bgmRetry, true);
setInterval(() => { if (bgm.on && !bgm.blocked) bgmUpdate(); }, 1000);   // ミッション設定の変更などにも追従
bgmUpdate();

/* ========== 操作画面(control.html)を開く ========== */
// 既に開いていれば再読み込みせずにそのまま使う
function openControl() {
  const w = window.open("", "sb_control", "width=980,height=860");
  if (!w) return false;                    // ポップアップがブロックされた
  w.focus();
  try { if (w.location.href === "about:blank") w.location.href = new URL("control.html", location.href).href; }
  catch (e) { w.location.href = "control.html"; }
  return true;
}
// 起動時に自動で開く。ブラウザにブロックされた場合は最初のキー/クリック時に開く
if (!openControl()) {
  const retry = () => { removeEventListener("keydown", retry, true); removeEventListener("mousedown", retry, true); openControl(); };
  addEventListener("keydown", retry, true); addEventListener("mousedown", retry, true);
}

/* ========== 操作画面(control.html)との連携 ========== */
const ch = "BroadcastChannel" in window ? new BroadcastChannel("scoreboard") : null;
function publish() {
  if (!ch) return;
  ch.postMessage({ type: "state", remaining, running: !!tick, paused,
    em: emActive ? { id: emActive.id, phase: emPhase, left: emPhase === "announce" ? emActive.dur : emTick ? Math.max(0, Math.round((emEnd - Date.now()) / 1000)) : emLeft } : null, final: finalMode,
    done: [...done], status: document.getElementById("status").textContent,
    view: sl.view, slide: curDeck()?.ready ? { s: curDeck().s, t: curDeck().t, steps: curDeck().steps[curDeck().s] || 0, last: curDeck().last } : null,
    slErr: [decks.slides.err, decks.end.err].filter(Boolean).join(" / "),
    bgm: { on: bgm.on, track: bgm.cur, blocked: bgm.blocked, manual: !!bgm.manual } });
}
if (ch) ch.onmessage = e => {
  const d = e.data;
  if (d.type === "cmd") {
    if (d.cmd === "set") setTimer();
    else if (d.cmd === "start") startTimer();
    else if (d.cmd === "pause") togglePause();
    else if (d.cmd === "clear") clearTimer();
    else if (d.cmd === "closeEm") endEmergency();
    else if (d.cmd === "begin") beginEmergency();
    else if (d.cmd === "final") toggleFinal();
    else if (d.cmd === "slNext") slNext();
    else if (d.cmd === "slBack") slBack();
    else if (d.cmd === "slFirst") showDeck(sl.view === "end" ? "end" : "slides");
    else if (d.cmd === "endStart") showEnd();
    else if (d.cmd === "bgm") toggleBgm();
    else if (d.cmd === "bgmPlay") playManual(d.file);
    else if (d.cmd === "bgmAuto") bgmAuto();
    else if (d.cmd === "slExit") setView("main");
    else if (d.cmd === "test") { const m = cfg.missions.find(x => x.id === d.id); if (m) startEmergency(m); }
  } else if (d.type === "cfg") loadCfg();
  publish();
};
setInterval(publish, 500);

/* ========== キー操作 ========== */
document.addEventListener("keydown", e => {
  if (e.key === "F1") { e.preventDefault(); document.body.classList.toggle("debug"); return; }
  // e.code を使うので、IMEオン/Caps Lockでも動きます
  if (e.code === "Space" || e.code === "F4" || e.code === "F12") e.preventDefault();
  // スライド画面(前説/後説)では slides.html の操作(Enter/Space/→/↓/PageDown=進む、Backspace/←/↑/PageUp=戻る、F=全画面)を適用
  if (curDeck() && !emActive) {
    if (["Enter", "NumpadEnter", "Space", "ArrowRight", "ArrowDown", "PageDown"].includes(e.code)) { e.preventDefault(); if (!e.repeat) slNext(); return; }
    if (["Backspace", "ArrowLeft", "ArrowUp", "PageUp"].includes(e.code)) { e.preventDefault(); if (!e.repeat) slBack(); return; }
    if (e.code === "KeyF") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); return; }
  }
  if (e.code === "Home") { e.preventDefault(); showDeck(sl.view === "end" ? "end" : "slides"); return; }
  if (e.code === "KeyE") { if (!e.repeat) showEnd(); return; }
  if (e.code === "KeyM") { if (!e.repeat) toggleBgm(); return; }
  if (e.code === "Digit1" || e.code === "Numpad1") openControl();
  else if (e.code === "KeyT") setTimer();
  else if (e.code === "Enter" || e.code === "NumpadEnter") startTimer();
  else if (e.code === "Space") togglePause();
  else if (e.code === "ArrowLeft") endEmergency();
  else if (e.code === "Digit0" || e.code === "Numpad0") clearTimer();
  else if (e.code === "F4") beginEmergency();
  else if (e.code === "F12") toggleFinal();
});
</script>
