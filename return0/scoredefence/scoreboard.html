<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard</title>
<style>
  html, body { height:100%; margin:0; overflow:hidden; background:#fff; color:#000; font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif; }
  #slider { display:flex; width:200vw; height:100%; transition:transform .7s ease-in-out; }
  #slider.em { transform:translateX(-100vw); }
  .screen { width:100vw; height:100%; flex:none; position:relative; box-sizing:border-box; }
  /* メイン画面: 上にタイマー、下に4分割 */
  #main { display:flex; flex-direction:column; }
  #timer { position:fixed; right:8px; bottom:32px; z-index:5; font-size:28px; font-weight:800; font-variant-numeric:tabular-nums; background:rgba(255,255,255,.85); padding:2px 8px; border-radius:4px; }
  #timer.ended { color:#dc2626; }
  #timer.paused { color:#888; }
  .grid { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px; background:#000; min-height:0; }
  .cell { position:relative; background:#fff; display:flex; align-items:center; justify-content:center; }
  .name { position:absolute; top:1.5vmin; left:2.5vmin; font-size:4vmin; font-weight:700; }
  .score { font-size:15vmin; font-weight:800; font-variant-numeric:tabular-nums; transition:color .3s; }
  .score.changed { color:#dc2626; }
  /* 緊急ミッション画面 */
  #em { background:#fff; }
  #emhead { position:absolute; top:2vmin; left:3vmin; z-index:2; background:#fff; padding:.5vmin 2vmin; border:2px solid #dc2626; border-radius:1.5vmin; }
  #emlabel { font-size:3vmin; font-weight:700; color:#dc2626; }
  #emtimer { font-size:9vmin; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
  #embody { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #embody img { max-width:100%; max-height:100%; object-fit:contain; }
  #emtext { font-size:10vmin; font-weight:800; color:#dc2626; }
  #status { position:fixed; right:8px; bottom:6px; font-size:12px; background:rgba(255,255,255,.85); padding:2px 6px; border-radius:4px; z-index:5; }
  /* デバッグ表示(F1で切り替え。通常は非表示) */
  #timer, #status { display:none; }
  body.debug #timer, body.debug #status { display:block; }
  /* 設定画面 */
  #settings { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:20; align-items:center; justify-content:center; }
  #settings.open { display:flex; }
  #panel { background:#fff; width:min(760px,94vw); max-height:90vh; overflow:auto; border-radius:10px; padding:20px; font-size:15px; }
  #panel h2 { margin:0 0 12px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 0; border-top:1px solid #ccc; }
  .row input[type=text], .row input[type=number] { width:80px; padding:4px; font-size:15px; }
  .row img { height:44px; border:1px solid #999; }
  button { font-size:14px; padding:5px 10px; cursor:pointer; }
  .hint { color:#555; font-size:13px; }
</style>
</head>
<body>
<div id="slider">
  <div class="screen" id="main">
    <div class="grid">
      <div class="cell"><div class="name">Team1</div><div class="score" id="s0">-</div></div>
      <div class="cell"><div class="name">Team2</div><div class="score" id="s1">-</div></div>
      <div class="cell"><div class="name">Team3</div><div class="score" id="s2">-</div></div>
      <div class="cell"><div class="name">Team4</div><div class="score" id="s3">-</div></div>
    </div>
  </div>
  <div class="screen" id="em">
    <div id="embody"></div>
    <div id="emhead"><div id="emlabel">緊急ミッション</div><div id="emtimer">01:00</div></div>
  </div>
</div>
<div id="timer">--:--</div>
<div id="status">読み込み中…</div>

<div id="settings"><div id="panel">
  <h2>設定 <span class="hint">(Escapeキーで開閉)</span></h2>
  <div>全体タイマー(1キーでセットされる時間): <input type="number" id="totalMin" min="1"> 分</div>
  <p class="hint">緊急ミッション: 「残り時間」がその値になった時に画面が切り替わります。</p>
  <div id="list"></div>
  <p><button id="addBtn">＋ 緊急ミッションを追加</button> <button id="closeBtn">閉じる</button></p>
</div></div>

<script>
/* ========== スコア取得 ========== */
const SHEET_ID = "1SBp0oQzCXvHXjJiSSaP_IdJwrLUkB9OYhSfoGcw49Ms";
const SHEET_NAME = "Score", RANGE = "C14:F14", INTERVAL_MS = 5000;
window.__onSheet = function (res) {
  const st = document.getElementById("status");
  try {
    if (res.status !== "ok") throw new Error(res.errors?.[0]?.message || "error");
    const cells = res.table.rows[0]?.c || [];
    for (let i = 0; i < 4; i++) {
      const c = cells[i], text = c ? (c.f ?? (c.v ?? "")) : "";
      const el = document.getElementById("s" + i);
      if (el.textContent !== String(text)) {
        el.textContent = text === "" ? "-" : text;
        el.classList.add("changed");
        setTimeout(() => el.classList.remove("changed"), 1200);
      }
    }
    st.textContent = "最終更新 " + new Date().toLocaleTimeString("ja-JP");
  } catch (e) { st.textContent = "取得失敗: " + e.message; }
};
function load() {
  document.getElementById("jsonp")?.remove();
  const s = document.createElement("script");
  s.id = "jsonp";
  s.onerror = () => { document.getElementById("status").textContent = "取得失敗(共有設定を確認)"; };
  s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:__onSheet&sheet=${encodeURIComponent(SHEET_NAME)}&range=${RANGE}&headers=0&_=${Date.now()}`;
  document.body.appendChild(s);
}
load(); setInterval(load, INTERVAL_MS);

/* ========== 設定(localStorageに保存) ========== */
let uid = 0;
const DEFAULT_CFG = { total: 3600, missions: [
  { at: 2400, dur: 60, img: "" },   // 残り40:00
  { at: 1200, dur: 60, img: "" }    // 残り20:00
]};
let cfg;
try { cfg = JSON.parse(localStorage.getItem("sb_cfg")); } catch (e) {}
if (!cfg || !Array.isArray(cfg.missions)) cfg = JSON.parse(JSON.stringify(DEFAULT_CFG));
cfg.missions.forEach(m => m.id = ++uid);
function saveCfg() {
  try { localStorage.setItem("sb_cfg", JSON.stringify(cfg)); return true; }
  catch (e) { alert("設定を保存できませんでした(画像が大きすぎる可能性があります)。"); return false; }
}
const fmt = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
function parseMS(t) {
  const p = String(t).trim().split(":").map(Number);
  if (p.some(isNaN)) return null;
  return p.length === 1 ? p[0] * 60 : p[0] * 60 + p[1];
}

/* ========== 緊急ミッション ========== */
const slider = document.getElementById("slider");
const emTimer = document.getElementById("emtimer");
let emActive = null, emTick = null, emEnd = 0, done = new Set();

function startEmergency(m) {
  done.add(m.id);
  emActive = m;
  const n = cfg.missions.indexOf(m) + 1;
  document.getElementById("emlabel").textContent = "緊急ミッション " + n;
  const body = document.getElementById("embody");
  body.innerHTML = "";
  if (m.img) { const i = document.createElement("img"); i.src = m.img; body.appendChild(i); }
  else { const d = document.createElement("div"); d.id = "emtext"; d.textContent = "緊急ミッション " + n; body.appendChild(d); }
  emTimer.textContent = fmt(m.dur);
  slider.classList.add("em");
  runEm(m.dur);
}
function runEm(sec) {
  emEnd = Date.now() + sec * 1000;
  clearInterval(emTick);
  emTick = setInterval(() => {
    const r = Math.max(0, Math.round((emEnd - Date.now()) / 1000));
    emTimer.textContent = fmt(r);
    if (r === 0) endEmergency();
  }, 250);
}
function endEmergency() {
  clearInterval(emTick); emTick = null; emActive = null;
  slider.classList.remove("em");
}
function checkMissions() {
  if (emActive || remaining === null || remaining <= 0) return;
  const due = cfg.missions.filter(m => !done.has(m.id) && m.at > 0 && remaining <= m.at)
                          .sort((a, b) => b.at - a.at)[0];
  if (due) startEmergency(due);
}

/* ========== メインタイマー ========== */
const timerEl = document.getElementById("timer");
let remaining = null, endAt = 0, tick = null, paused = false, emLeft = 0;
function render() {
  timerEl.textContent = remaining === null ? "--:--" : fmt(remaining);
  timerEl.classList.toggle("ended", remaining === 0);
  timerEl.classList.toggle("paused", paused);
}
function stop() { clearInterval(tick); tick = null; }
function setTimer() { stop(); paused = false; endEmergency(); done.clear(); remaining = cfg.total; render(); }
function startTimer() {
  if (tick || remaining === null || remaining <= 0) return;
  paused = false;
  endAt = Date.now() + remaining * 1000;
  tick = setInterval(() => {
    remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    render(); checkMissions();
    if (remaining === 0) stop();
  }, 250);
  if (emActive) runEm(emLeft);
  render(); checkMissions();
}
// 9キー: 一時停止/再開(緊急ミッション中は緊急タイマーも止まる)
function togglePause() {
  if (paused) { startTimer(); return; }
  if (!tick) return;
  remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
  if (emActive) {
    emLeft = Math.max(0, Math.round((emEnd - Date.now()) / 1000));
    clearInterval(emTick); emTick = null;
  }
  stop(); paused = true; render();
}
// 0キー: --:-- に戻す
function clearTimer() {
  stop(); paused = false; endEmergency(); done.clear();
  remaining = null; render();
}

/* ========== 設定画面UI ========== */
const settingsEl = document.getElementById("settings"), listEl = document.getElementById("list");
const totalIn = document.getElementById("totalMin");
function buildList() {
  listEl.innerHTML = "";
  cfg.missions.forEach((m, i) => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<b>#${i + 1}</b> 残り <input type="text" class="at" value="${fmt(m.at)}" title="mm:ss"> で発動
      / タイマー <input type="number" class="dur" min="1" value="${m.dur}"> 秒
      / 画像 <input type="file" class="file" accept="image/*">
      ${m.img ? `<img src="${m.img}"><button class="rmimg">画像削除</button>` : `<span class="hint">(画像なし)</span>`}
      <button class="test">テスト表示</button><button class="del">削除</button>`;
    row.querySelector(".at").onchange = e => { const v = parseMS(e.target.value); if (v !== null) m.at = v; e.target.value = fmt(m.at); saveCfg(); };
    row.querySelector(".dur").onchange = e => { m.dur = Math.max(1, +e.target.value || 60); e.target.value = m.dur; saveCfg(); };
    row.querySelector(".file").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { m.img = r.result; saveCfg(); buildList(); };
      r.readAsDataURL(f);
    };
    row.querySelector(".rmimg")?.addEventListener("click", () => { m.img = ""; saveCfg(); buildList(); });
    row.querySelector(".test").onclick = () => { settingsEl.classList.remove("open"); startEmergency(m); };
    row.querySelector(".del").onclick = () => { cfg.missions.splice(i, 1); saveCfg(); buildList(); };
    listEl.appendChild(row);
  });
}
function toggleSettings() {
  const open = settingsEl.classList.toggle("open");
  if (open) { totalIn.value = cfg.total / 60; buildList(); }
}
totalIn.onchange = () => { cfg.total = Math.max(1, Math.round(+totalIn.value || 60)) * 60; totalIn.value = cfg.total / 60; saveCfg(); };
document.getElementById("addBtn").onclick = () => { cfg.missions.push({ id: ++uid, at: 600, dur: 60, img: "" }); saveCfg(); buildList(); };
document.getElementById("closeBtn").onclick = toggleSettings;

document.addEventListener("keydown", e => {
  if (e.key === "F1") { e.preventDefault(); document.body.classList.toggle("debug"); return; }
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "Escape") toggleSettings();
  else if (settingsEl.classList.contains("open")) return;
  else if (e.key === "t") setTimer();
  else if (e.key === "Enter") startTimer();
  else if (e.key === " ") togglePause();
  else if (e.key === "ArrowLeft") endEmergency();
  else if (e.key === "0") clearTimer();
});
</script>
</body>
</html>
