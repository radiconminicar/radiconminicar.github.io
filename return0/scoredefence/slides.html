<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スライド</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500&display=swap" rel="stylesheet">
<style>
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
html,body{margin:0;height:100%;background:#111;overflow:hidden;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:#fff;overflow:hidden;transform-origin:0 0;
 font-family:'Zen Maru Gothic','Zen Maru Gothic Medium','Hiragino Maru Gothic ProN','Yu Gothic','Meiryo',sans-serif;font-weight:500;color:#000}
#stage *{box-sizing:border-box}
#stage [data-a]{position:absolute}
.tb{position:absolute;padding:7.2px 14.4px;white-space:nowrap}
.bl{margin:0;padding:0 0 0 135px;white-space:normal}.bl li{text-indent:0;margin:0;padding:0}
.bl{list-style:disc}
.o,.ln,.im,.ck{position:absolute}
#map{left:0;top:0;width:2231px;height:1580px;transform-origin:0 0}
#map>*{position:absolute}
.hid{visibility:hidden!important}
.fx{animation-fill-mode:both;animation-timing-function:linear;animation-delay:var(--del);animation-duration:var(--dur)}
.fx-appear{animation-name:kfAppear}
.fx-fade{animation-name:kfFade}
.fx-wipe-top{animation-name:kfWTop}
.fx-wipe-left{animation-name:kfWLeft}
.fx-fly-top{animation-name:kfFlyT}
.fx-fly-right{animation-name:kfFlyR}
.fx-wheel{animation-name:kfWheel;-webkit-mask-image:conic-gradient(#000 var(--a),transparent 0);mask-image:conic-gradient(#000 var(--a),transparent 0)}
@keyframes kfAppear{from{visibility:hidden}to{visibility:visible}}
@keyframes kfFade{from{opacity:0}to{opacity:1}}
@keyframes kfWTop{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes kfWLeft{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes kfFlyT{from{translate:0 var(--fy)}to{translate:0 0}}
@keyframes kfFlyR{from{translate:var(--fx) 0}to{translate:0 0}}
@keyframes kfWheel{from{--a:0deg}to{--a:360deg}}
@keyframes kfIn{from{opacity:0}to{opacity:1}}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.6);font:14px sans-serif;padding:8px 14px;border-radius:8px;transition:opacity .6s;pointer-events:none;z-index:9}
</style></head><body>

<script>

(function(){
var stage=document.getElementById('stage'),hint=document.getElementById('hint');
var els=[].slice.call(stage.querySelectorAll('[data-a]'));

var STEPS={1:0,2:1,3:0,4:1,5:1,6:1,7:0,8:3,9:1,10:0,11:0};
var LAST=11;
var cur={s:1,t:0},shown=new Map(),first=true;
function fit(){var k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='translate('+(-960*k)+'px,'+(-540*k)+'px) scale('+k+')';}
addEventListener('resize',fit);fit();
function P(){return cur.s*100+cur.t}
function setCam(el,c,instant){
  if(!el)return;
  if(instant){el.style.transition='none';}
  el.style.transform='translate('+c[0]+'px,'+c[1]+'px) scale('+c[2]+')';
  if(instant){void el.offsetWidth;el.style.transition='transform 1.6s cubic-bezier(.45,0,.25,1)';}
}
function render(animate,prev){
  var p=P();
  els.forEach(function(e){
    var a=+e.dataset.a,u=e.dataset.u?+e.dataset.u:Infinity;
    // default: element lives until the end of its slide
    if(!e.dataset.u && e!==map && e!==l3){u=(Math.floor(a/100)+1)*100;}
    var vis=p>=a&&p<u,was=shown.get(e)||false;
    if(vis&&!was){
      e.classList.remove('hid');
      var fx=e.dataset.fx;
      e.className=e.className.replace(/\bfx[-\w]*/g,'').trim();
      e.style.animation='';
      if(animate&&fx){
        if(fx==='fly-top')e.style.setProperty('--fy',-(e.offsetTop+e.offsetHeight+20)+'px');
        if(fx==='fly-right')e.style.setProperty('--fx',(1920-e.offsetLeft+20)+'px');
        e.style.setProperty('--del',e.dataset.del+'ms');e.style.setProperty('--dur',(+e.dataset.dur||1)+'ms');
        void e.offsetWidth;
        e.classList.add('fx','fx-'+fx);
      }
    } else if(!vis&&was){
      e.className=e.className.replace(/\bfx[-\w]*/g,'').trim();e.classList.add('hid');
    } else if(!vis&&!was&&first){e.classList.add('hid');}

  if(cur.t>0)go(cur.s,cur.t-1,false);
