<!DOCTYPE html>
<html>
  <head>
    <title>HIDDEN</title>
    <link rel = "stylesheet" href = "css/player.css" type = "text/css">
  </head>

  <body>
    <div id = "title-container">
      <p id = "title">
        HIDDEN
        <img src = "images/noise.gif" id = "title-noise">
      </p>
    </div>

    <hr>

    <!--
      ここにプレイ画面が来るよ
    -->

    <div id = "timer-container">
      <p id = "timer">
        00 : 00 : 00
        <img src = "images/noise.gif" id = "timer-noise">
      </p>
    </div>

    <div id = "player">
      <div id = "prev">
        <img src = "images/noise.gif" id = "prev-noise">
      </div>
      <img class = "question" src = "images/q1.gif">
      <div id = "next">
        <img src = "images/noise.gif" id = "next-noise">
      </div>
    </div>

    <div id = "submit-area">
      <input id = "answer" type = "text">
      <button id = "submit">送信 <img src = "images/noise.gif" id = "button-noise"></button>
      
    </div>
    
    <hr>

    <!-- <p class = "sentence">
      ログ
    </p> -->
    <p id = "log">
      <img src = "images/noise.gif" id = "log-noise">
    </p>
  </body>

  <script src = "js/player.js"></script>
</html>
